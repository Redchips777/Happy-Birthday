<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Birthday Pop-up</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
      rel="stylesheet"
    />

    <style>
      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(-20px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      .animate-fadeIn {
        animation: fadeIn 0.5s ease-out;
      }

      /* 🎈 Crisp Balloon Style */
      .balloon {
        position: absolute;
        border-radius: 50%;
        pointer-events: none;
        animation-timing-function: ease-out;
        animation-fill-mode: forwards;
        z-index: 100;
        box-shadow: inset -8px -12px 0 rgba(0, 0, 0, 0.18);
      }

      .balloon::after {
        content: "";
        position: absolute;
        top: 15%;
        left: 20%;
        width: 25%;
        height: 25%;
        background: rgba(255, 255, 255, 0.7);
        border-radius: 50%;
        filter: blur(2px);
      }

      .string {
        position: absolute;
        width: 2px;
        height: 50px;
        background: #444;
        top: 100%;
        left: 50%;
        transform: translateX(-50%);
        opacity: 0.8;
      }
    </style>
  </head>

  <body
    class="bg-gradient-to-b from-blue-200 via-pink-200 to-yellow-100 flex items-center justify-center min-h-screen p-4 relative overflow-hidden"
  >
    <!-- Clickable Birthday Box -->
    <div
      id="clickBox"
      class="bg-pink-500 hover:bg-pink-600 text-white font-bold py-6 px-8 rounded-2xl shadow-2xl cursor-pointer text-center transition-all duration-300 transform hover:scale-105 w-full max-w-xs flex flex-col items-center gap-2"
    >
      <i class="fa-solid fa-gift text-4xl"></i>
      <span class="text-lg">Buksan Mo 🎉</span>
    </div>

    <!-- Birthday Popup -->
    <div
      id="popupCard"
      class="fixed inset-0 flex items-center justify-center bg-black bg-opacity-50 hidden p-4 overflow-y-auto"
    >
      <div
        class="bg-gradient-to-tr from-yellow-400 to-pink-500 rounded-3xl shadow-2xl w-full max-w-xs sm:max-w-sm mx-auto my-8 p-4 sm:p-6 relative text-center text-white animate-fadeIn"
      >
        <button
          id="closeBtn"
          class="absolute top-3 right-3 text-white text-2xl hover:text-blue-300"
        >
          &times;
        </button>

        <div class="w-32 h-32 sm:w-40 sm:h-40 mx-auto mb-4">
          <img
            src="https://media.tenor.com/lrqpjkFFu7UAAAAM/dino-kuning-dino-boy.gif"
            class="w-full h-full object-cover rounded-full border-4 border-white shadow-lg"
            alt="Birthday Dino"
          />
        </div>

        <h2 class="text-2xl sm:text-3xl font-extrabold mb-1">Happy Birthday Carla Anne Marie! 🎂</h2>
        <p class="text-base sm:text-lg mb-4 px-2">
          Wishing you a day full of joy, surprises, and love! 💖
        </p>
        <p class="text-sm sm:text-base"><small>Click celebrate</small></p>
        <button
          id="celebrateBtn"
          class="mt-4 bg-white text-pink-600 font-bold py-2 px-6 rounded-full hover:bg-yellow-300 transition-colors relative overflow-hidden text-sm sm:text-base w-full sm:w-auto"
        >
          Celebrate 🎉
        </button>
      </div>
    </div>

    <!-- Celebration GIF -->
    <div
      id="celebration"
      class="fixed inset-0 flex items-center justify-center hidden z-50 pointer-events-none"
    >
      <img
        src="https://media.tenor.com/6iqUYEgLmz0AAAAM/nailong-nailong-dancing.gif"
        class="w-64 h-64 rounded-full"
      />
    </div>

    <script>
      const box = document.getElementById("clickBox");
      const popup = document.getElementById("popupCard");
      const closeBtn = document.getElementById("closeBtn");
      const celebrateBtn = document.getElementById("celebrateBtn");
      const celebration = document.getElementById("celebration");

      // Open popup
      box.addEventListener("click", () => {
        showBalloon();

        popup.classList.remove("hidden");
      });

      // Close popup
      closeBtn.addEventListener("click", () => {
        popup.classList.add("hidden");
      });

      // Close when clicking background
      popup.addEventListener("click", (e) => {
        if (e.target === popup) popup.classList.add("hidden");
      });

      // 🎈 Balloon Animation + Celebration GIF
      celebrateBtn.addEventListener("click", () => {
        const balloonCount = window.innerWidth < 640 ? 15 : 20; // Fewer balloons on mobile
        const maxBalloonSize = window.innerWidth < 640 ? 40 : 50; // Smaller balloons on mobile
        const minBalloonSize = window.innerWidth < 640 ? 25 : 30;
        
        for (let i = 0; i < 100; i++) {
          const balloon = document.createElement("div");
        //  const size = Math.random() * (maxBalloonSize - minBalloonSize) + minBalloonSize;
          const size = Math.random() * 30 + 50;
          balloon.classList.add("balloon");
          balloon.style.width = `${size}px`;
          balloon.style.height = `${size * 1.25}px`;

          // Calculate position to ensure balloons stay within viewport
          const maxLeft = window.innerWidth - size;
          const leftPosition = Math.max(10, Math.min(maxLeft - 10, Math.random() * maxLeft));
          
          balloon.style.bottom = `-${size + 50}px`;
          balloon.style.left = `${leftPosition}px`;

          // 🎈 Vibrant colors
          const colors = [
            "#ff4b4b",
            "#ff9f1c",
            "#ffda3e",
            "#5dd39e",
            "#3da9fc",
            "#9d4edd",
            "#ff77e9",
            "#00c2ff",
          ];
          balloon.style.backgroundColor =
            colors[Math.floor(Math.random() * colors.length)];

          // Add balloon string
          const string = document.createElement("div");
          string.classList.add("string");
          balloon.appendChild(string);

          document.body.appendChild(balloon);

          // 🎈 Dynamic rise with horizontal drift and fade, constrained to viewport
          const riseDistance = window.innerHeight + size * 2;
          const duration = 5000 + Math.random() * 3000; // 5-8 seconds

          // Limit drift so balloon never leaves the visible width
          const maxLeftOffset = (maxLeft - 10) - leftPosition;
          const minLeftOffset = 10 - leftPosition;
          const horizontalDrift =
            Math.random() * (maxLeftOffset - minLeftOffset) + minLeftOffset;
          
          // Create keyframes for smooth animation
          const keyframes = [
            { 
              transform: `translate(0, 0)`, 
              opacity: 0.9 
            },
            { 
              transform: `translate(${horizontalDrift}px, -${riseDistance}px)`,
              opacity: 0 
            }
          ];
          
          // Apply the animation
          const animation = balloon.animate(keyframes, {
            duration: duration,
            easing: "ease-out",
            fill: "forwards",
          });

          // Clean up after animation completes
          animation.onfinish = () => balloon.remove();
          setTimeout(() => balloon.remove(), duration + 1000);
        }

        // Celebration GIF
        celebration.classList.remove("hidden");
        setTimeout(() => celebration.classList.add("hidden"), 4000);
      });

      function showBalloon(){
        for (let i = 0; i < 100; i++) {
          const balloon = document.createElement("div");
          const size = Math.random() * 30 + 50;
          balloon.classList.add("balloon");
          balloon.style.width = size + "px";
          balloon.style.height = size * 1.25 + "px";

          // Start position: BELOW the screen
          const startY = window.innerHeight + 150;
          balloon.style.bottom = "-" + (size + 100) + "px";
          const maxLeft = window.innerWidth - size;
          const leftPosition = Math.max(10, Math.min(maxLeft - 10, Math.random() * maxLeft));
          balloon.style.left = leftPosition + "px";

          // 🎈 Vibrant colors
          const colors = [
            "#ff4b4b",
            "#ff9f1c",
            "#ffda3e",
            "#5dd39e",
            "#3da9fc",
            "#9d4edd",
            "#ff77e9",
            "#00c2ff",
          ];
          balloon.style.backgroundColor =
            colors[Math.floor(Math.random() * colors.length)];

          // Add balloon string
          const string = document.createElement("div");
          string.classList.add("string");
          balloon.appendChild(string);

          document.body.appendChild(balloon);

          // 🎈 Dynamic rise with horizontal drift and fade, constrained to viewport
          const riseDistance = window.innerHeight + size * 2;
          const duration = 5000 + Math.random() * 3000; // 5-8 seconds

          // Limit drift so balloon never leaves the visible width
          const maxLeftOffset = (maxLeft - 10) - leftPosition;
          const minLeftOffset = 10 - leftPosition;
          const horizontalDrift =
            Math.random() * (maxLeftOffset - minLeftOffset) + minLeftOffset;
          
          // Create keyframes for smooth animation
          const keyframes = [
            { 
              transform: `translate(0, 0)`, 
              opacity: 0.9 
            },
            { 
              transform: `translate(${horizontalDrift}px, -${riseDistance}px)`,
              opacity: 0 
            }
          ];
          
          // Apply the animation
          const animation = balloon.animate(keyframes, {
            duration: duration,
            easing: "ease-out",
            fill: "forwards",
          });

          // Clean up after animation completes
          animation.onfinish = () => balloon.remove();
          setTimeout(() => balloon.remove(), duration + 1000);
        }
      }
    </script>
  </body>
</html>
